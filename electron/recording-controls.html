<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      height: 54px;
      background: rgba(10, 15, 28, 0.96);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      -webkit-app-region: drag;
      user-select: none;
    }

    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      animation: blink 1.2s ease-in-out infinite;
    }
    .dot.paused { animation: none; background: #475569; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }
    .info-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #475569;
      line-height: 1;
      text-transform: uppercase;
    }
    .info-timer {
      font-size: 17px;
      font-weight: 700;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      letter-spacing: 0.5px;
    }

    .spacer { flex: 1; -webkit-app-region: drag; }

    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: #94a3b8;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover { background: rgba(255,255,255,0.14); color: #f1f5f9; }
    .btn.cancel:hover { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .btn.stop {
      background: #6366f1;
      color: #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
    }
    .btn.stop:hover { background: #4f46e5; }

    svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="dot" id="dot"></div>

  <div class="info">
    <span class="info-label" id="label">Recording</span>
    <span class="info-timer" id="timer">0:00</span>
  </div>

  <div class="spacer"></div>

  <div class="actions">
    <!-- Discard -->
    <button class="btn cancel" id="btnCancel" title="Discard recording">
      <svg viewBox="0 0 16 16">
        <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
        <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
      </svg>
    </button>

    <!-- Pause / Resume -->
    <button class="btn" id="btnPause" title="Pause">
      <!-- pause icon -->
      <svg id="iconPause" viewBox="0 0 16 16">
        <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>
      </svg>
      <!-- play icon (hidden by default) -->
      <svg id="iconPlay" viewBox="0 0 16 16" style="display:none">
        <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
      </svg>
    </button>

    <!-- Stop & Send -->
    <button class="btn stop" id="btnStop" title="Stop &amp; Send">
      <svg viewBox="0 0 16 16">
        <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083l6-15Zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471-.47 1.178Z"/>
      </svg>
    </button>
  </div>

  <script>
    function fmt(s) {
      if (!s || !isFinite(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + sec.toString().padStart(2, '0');
    }

    window.recordingControls.onStateUpdate(function (state) {
      document.getElementById('timer').textContent = fmt(state.duration);
      const paused = !!state.isPaused;
      document.getElementById('dot').classList.toggle('paused', paused);
      document.getElementById('label').textContent = paused ? 'Paused' : 'Recording';
      document.getElementById('iconPause').style.display = paused ? 'none' : '';
      document.getElementById('iconPlay').style.display  = paused ? ''     : 'none';
      document.getElementById('btnPause').title = paused ? 'Resume' : 'Pause';
    });

    document.getElementById('btnCancel').onclick = () => window.recordingControls.sendAction('cancel');
    document.getElementById('btnPause').onclick  = () => window.recordingControls.sendAction('pause');
    document.getElementById('btnStop').onclick   = () => window.recordingControls.sendAction('stop');
  </script>
</body>
</html>
