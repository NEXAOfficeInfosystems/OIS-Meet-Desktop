<aside class="fluent-sidebar" [class.is-collapsed]="isCollapsed()">
  <!-- Brand Header -->
  <!-- <div class="sidebar-header">
    <div class="logo-wrap" (click)="setActiveTab('dashboard')">
      <img src="assets/login/ois-meet-logo.svg" alt="OIS MEET" class="sidebar-logo" />
    </div>
  </div> -->

  <!-- Main Navigation Items -->
  <nav class="nav-list">
    <div class="nav-item" [class.active]="activeTab === 'chat'" (click)="setActiveTab('chat')" [title]="isCollapsed() ? 'Chat' : ''">
      <i class="bi bi-chat-dots"></i>
      <span class="nav-label" *ngIf="!isCollapsed()">Chat</span>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'meetings'" (click)="setActiveTab('meetings')" [title]="isCollapsed() ? 'Meetings' : ''">
      <i class="bi bi-camera-video"></i>
      <span class="nav-label" *ngIf="!isCollapsed()">Meetings</span>
      <fluent-badge appearance="accent" class="nav-badge" *ngIf="!isCollapsed()">3</fluent-badge>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'calendar'" (click)="setActiveTab('calendar')" [title]="isCollapsed() ? 'Calendar' : ''">
      <i class="bi bi-calendar3"></i>
      <span class="nav-label" *ngIf="!isCollapsed()">Calendar</span>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'activity'" (click)="setActiveTab('activity')" [title]="isCollapsed() ? 'Activity' : ''">
      <i class="bi bi-bell"></i>
      <span class="nav-label" *ngIf="!isCollapsed()">Activity</span>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'settings'" (click)="setActiveTab('settings')" [title]="isCollapsed() ? 'Settings' : ''">
      <i class="bi bi-gear"></i>
      <span class="nav-label" *ngIf="!isCollapsed()">Settings</span>
    </div>
  </nav>

  <!-- Removed Profile Section, Contacts, and Upgrade button per User Request -->
</aside>
