<aside class="fluent-sidebar" [class.is-collapsed]="isCollapsed()">
  <!-- Brand Header -->
  <!-- <div class="sidebar-header">
    <div class="logo-wrap" (click)="setActiveTab('dashboard')">
      <img src="assets/login/ois-meet-logo.svg" alt="OIS MEET" class="sidebar-logo" />
    </div>
  </div> -->

  <!-- Main Navigation Items -->
  <nav class="nav-list">
    <div class="nav-item" [class.active]="activeTab === 'chat'" (click)="setActiveTab('chat')"
      [title]="isCollapsed() ? 'Chat' : ''">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" />
      </svg>
      <span class="nav-label" *ngIf="!isCollapsed()">Chat</span>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'meetings'" (click)="setActiveTab('meetings')"
      [title]="isCollapsed() ? 'Meetings' : ''">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M14 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1Zm7 11-6-2V9l6-2v10Z" />
      </svg>

      <span class="nav-label" *ngIf="!isCollapsed()">Meetings</span>
      <fluent-badge appearance="accent" class="nav-badge" *ngIf="!isCollapsed()">3</fluent-badge>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'calendar'" (click)="setActiveTab('calendar')"
      [title]="isCollapsed() ? 'Calendar' : ''">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z" />
      </svg>

      <span class="nav-label" *ngIf="!isCollapsed()">Calendar</span>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'activity'" (click)="setActiveTab('activity')"
      [title]="isCollapsed() ? 'Activity' : ''">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 5.365V3m0 2.365a5.338 5.338 0 0 1 5.133 5.368v1.8c0 2.386 1.867 2.982 1.867 4.175 0 .593 0 1.292-.538 1.292H5.538C5 18 5 17.301 5 16.708c0-1.193 1.867-1.789 1.867-4.175v-1.8A5.338 5.338 0 0 1 12 5.365ZM8.733 18c.094.852.306 1.54.944 2.112a3.48 3.48 0 0 0 4.646 0c.638-.572 1.236-1.26 1.33-2.112h-6.92Z" />
      </svg>

      <span class="nav-label" *ngIf="!isCollapsed()">Activity</span>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'settings'" (click)="setActiveTab('settings')"
      [title]="isCollapsed() ? 'Settings' : ''">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 13v-2a1 1 0 0 0-1-1h-.757l-.707-1.707.535-.536a1 1 0 0 0 0-1.414l-1.414-1.414a1 1 0 0 0-1.414 0l-.536.535L14 4.757V4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v.757l-1.707.707-.536-.535a1 1 0 0 0-1.414 0L4.929 6.343a1 1 0 0 0 0 1.414l.536.536L4.757 10H4a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h.757l.707 1.707-.535.536a1 1 0 0 0 0 1.414l1.414 1.414a1 1 0 0 0 1.414 0l.536-.535 1.707.707V20a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-.757l1.707-.708.536.536a1 1 0 0 0 1.414 0l1.414-1.414a1 1 0 0 0 0-1.414l-.535-.536.707-1.707H20a1 1 0 0 0 1-1Z" />
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
      </svg>

      <span class="nav-label" *ngIf="!isCollapsed()">Settings</span>
    </div>
  </nav>

  <!-- Removed Profile Section, Contacts, and Upgrade button per User Request -->
</aside>
