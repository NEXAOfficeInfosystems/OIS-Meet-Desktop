  <!-- Main Navigation Items -->
  <nav class="nav-list">
    <div class="nav-item" [class.active]="activeTab === 'chat'" (click)="setActiveTab('chat')">
      <i [class]="activeTab === 'chat' ? 'bi bi-chat-dots-fill' : 'bi bi-chat-dots'"></i>
      <span class="nav-label">Chat</span>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'meetings'" (click)="setActiveTab('meetings')">
      <i [class]="activeTab === 'meetings' ? 'bi bi-camera-video-fill' : 'bi bi-camera-video'"></i>
      <span class="nav-label">Meetings</span>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'calendar'" (click)="setActiveTab('calendar')">
      <i [class]="activeTab === 'calendar' ? 'bi bi-calendar-event-fill' : 'bi bi-calendar-event'"></i>
      <span class="nav-label">Calendar</span>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'activity'" (click)="setActiveTab('activity')">
      <i [class]="activeTab === 'activity' ? 'bi bi-bell-fill' : 'bi bi-bell'"></i>
      <span class="nav-label">Activity</span>
    </div>

    <div class="nav-item" [class.active]="activeTab === 'settings'" (click)="setActiveTab('settings')">
      <i [class]="activeTab === 'settings' ? 'bi bi-gear-fill' : 'bi bi-gear'"></i>
      <span class="nav-label">Settings</span>
    </div>
