<header class="fluent-header">
  <div class="header-inner">
    <!-- Left: Branding (Logo) -->
    <a routerLink="/dashboard" class="logo-link">
      <img src="assets/login/ois-meet-logo.svg" alt="OIS Meet Logo" class="header-logo" />
      <span class="app-name">OIS Meet</span>
    </a>

    <!-- Center: Search Bar -->
    <div class="search-container">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Search for chats, people, or files" class="search-input" />
        <span class="search-shortcut">Ctrl+F</span>
      </div>
    </div>

    <!-- Right: Actions -->
    <div class="actions-container">
      <fluent-button appearance="stealth" title="New Call" (click)="openMeetNowDialog('meet-now')">
        <i class="bi bi-camera-video"></i>
      </fluent-button>

      <fluent-button appearance="stealth" title="New Chat" routerLink="/chat">
        <i class="bi bi-chat-text"></i>
      </fluent-button>

      <fluent-button appearance="stealth" title="Notifications">
        <i class="bi bi-bell"></i>
        <fluent-badge appearance="accent" class="action-badge"></fluent-badge>
      </fluent-button>

      <fluent-divider orientation="vertical" class="action-divider"></fluent-divider>

      <!-- Theme Toggle -->
      <fluent-button appearance="stealth" (click)="toggleTheme()" [title]="theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        <i [class]="theme === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars'"></i>
        <span class="theme-text">{{ theme === 'dark' ? 'Dark' : 'Light' }}</span>
      </fluent-button>

      <!-- User Avatar Profile -->
      <div class="user-profile" (click)="toggleUserMenu($event)">
        <img src="assets/header/profile.png" alt="User Profile" class="header-avatar" />
        <i class="bi bi-chevron-down ms-1"></i>
      </div>

      <!-- Profile Dropdown (Fluent Design) -->
      <div class="profile-dropdown" *ngIf="isUserMenuOpen">
        <div class="dropdown-header">
          <img src="assets/header/profile.png" class="dropdown-avatar" />
          <div class="dropdown-user-info">
            <span class="user-name">{{ userFullName }}</span>
            <span class="user-status online">Available</span>
          </div>
        </div>
        <fluent-divider></fluent-divider>
        <button class="dropdown-item" routerLink="/settings">
          <i class="bi bi-person me-2"></i> My Profile
        </button>
        <button class="dropdown-item" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i> Log out
        </button>
      </div>
    </div>
  </div>
</header>
