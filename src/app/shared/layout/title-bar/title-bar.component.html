<header class="title-bar" *ngIf="isElectron || !isLoginPage" [class.is-electron]="isElectron"
  [class.login-mode]="isLoginPage">
  <!-- Brand & Drag Section: Only show if NOT login page OR (is Electron and we want to allow dragging but user said hide drag icon) -->
  <div class="brand-section">
    <div class="drag-handle" *ngIf="isElectron && !isLoginPage"></div>
    <button class="icon-btn sidebar-toggle-btn" (click)="toggleSidebar()" title="Toggle Sidebar" *ngIf="!isLoginPage">
      <i class="bi bi-list"></i>
    </button>
    <a class="app-brand" [routerLink]="isLoginPage ? '/login' : '/dashboard'" title="Go to Home">
      <img src="assets/login/logo.png" alt="OIS MEET" class="app-logo" />
      <span class="app-title">OIS MEET</span>
    </a>
  </div>

  <!-- Center Search: Only if authenticated and not login page -->
  <div class="search-container" *ngIf="!isLoginPage && (isAuthenticated$ | async)">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" placeholder="Search for chats, people, or files" class="search-input" />
      <span class="search-shortcut">Ctrl+F</span>
    </div>
  </div>

  <!-- Right Actions: Only if authenticated and not login page -->
  <div class="main-actions" *ngIf="!isLoginPage && (isAuthenticated$ | async)">
    <div class="meet-controls d-none d-lg-flex">
      <button type="button" class="btn-meet btn-meet-primary" (click)="openMeetNowDialog('meet-now')">
        <i class="bi bi-camera-video"></i>
        <span>Meet Now</span>
      </button>
      <button type="button" class="btn-meet btn-meet-outline" (click)="openMeetNowDialog('join-meeting')">
        <i class="bi bi-plus"></i>
        <span>Join</span>
      </button>
    </div>

    <div class="right-actions">
      <div class="action-group">
        <!-- <button type="button" class="icon-btn theme-toggle" (click)="toggleTheme()" title="Toggle Theme">
          <i class="bi"
            [ngClass]="theme === 'dark' ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill text-primary'"></i>
        </button> -->

        <div class="user-dropdown">
          <button type="button" class="avatar-trigger" (click)="toggleUserMenu($event)" [class.active]="isUserMenuOpen">
            <div class="avatar-circle">
              <i class="bi bi-person-fill"></i>
            </div>
            <i class="bi bi-chevron-down caret-icon"></i>
          </button>

          <div class="dropdown-window shadow" *ngIf="isUserMenuOpen" (click)="$event.stopPropagation()">
            <!-- Dropdown content... -->
            <div class="user-profile-header">
              <div class="profile-avatar-large"><i class="bi bi-person-fill"></i></div>
              <div class="profile-details">
                <div class="profile-name">{{ userFullName || 'User' }}</div>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <div class="user-company-selector">
              <button class="company-select-btn" (click)="toggleCompanyMenu($event)"
                [class.expanded]="isCompanyMenuOpen">
                <div class="btn-icon"><i class="bi bi-building"></i></div>
                <div class="btn-content">
                  <span class="btn-label">Current Company</span>
                  <span class="btn-value">{{ getSelectedCompanyName() }}</span>
                </div>
                <i class="bi bi-chevron-down chevron" [class.rotate]="isCompanyMenuOpen"></i>
              </button>

              <div class="company-list-popover shadow animate-slide-up" *ngIf="isCompanyMenuOpen"
                (click)="$event.stopPropagation()">
                <div class="company-option" *ngFor="let company of companyList" (click)="selectCompany(company)"
                  [class.is-active]="company.companyId === selectedCompanyId">
                  <div class="option-details">
                    <div class="option-name">{{ company.name }}</div>
                    <div class="option-status" *ngIf="company.companyId === selectedCompanyId">Active Account</div>
                  </div>
                  <i class="bi bi-check-circle-fill text-success" *ngIf="company.companyId === selectedCompanyId"></i>
                </div>
                <div class="p-3 text-center opacity-50 fs-xs" *ngIf="companyList.length === 0">
                  Fetching company list...
                </div>
              </div>
            </div>

            <div class="dropdown-divider"></div>
            <button class="logout-btn" (click)="logout()">
              <i class="bi bi-box-arrow-right me-2"></i>Logout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Far Right: Electron Window Controls (Always show in Electron if we keep the header) -->
  <div class="window-controls ms-auto" *ngIf="isElectron">
    <button class="control-btn minimize" (click)="onMinimize()" title="Minimize">
      <svg width="10" height="10" viewBox="0 0 10 1" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="10" height="1" fill="currentColor" />
      </svg>
    </button>
    <button class="control-btn maximize" (click)="onMaximize()" title="{{ isMaximized ? 'Restore' : 'Maximize' }}">
      <svg *ngIf="!isMaximized" width="10" height="10" viewBox="0 0 10 10" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" />
      </svg>
      <svg *ngIf="isMaximized" width="10" height="10" viewBox="0 0 10 10" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <path d="M3.5 0.5H9.5V6.5" stroke="currentColor" />
        <rect x="0.5" y="3.5" width="6" height="6" stroke="currentColor" fill="transparent" />
      </svg>
    </button>
    <button class="control-btn close" (click)="onClose()" title="Close">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.2" />
      </svg>
    </button>
  </div>
</header>
