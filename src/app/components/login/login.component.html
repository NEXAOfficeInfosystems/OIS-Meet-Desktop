<div class="login-container">

  <!-- LEFT PANEL: Branding & Welcome -->
  <section class="left-panel animate-fade-in">
    <div class="branding-content">
      <div class="brand-header mb-5">
        <img src="assets/login/ois-meet-logo.svg" width="180" alt="OIS Meet Logo" class="brand-logo">
      </div>

      <div class="hero-content">
        <h1 class="hero-title">Welcome to<br>OIS <span class="accent-green">MEET</span></h1>
        <div class="divider"></div>
        <p class="hero-subtext">Sign in once to access all your connected services. Collaborate seamlessly across your
          organization.</p>
      </div>

      <div class="brand-footer mt-5 opacity-50">
        <p class="mb-0">Powered by OIS &copy; 2026</p>
      </div>
    </div>
  </section>

  <!-- RIGHT PANEL: Authentication Form -->
  <section class="right-panel">

    <div class="auth-card-container animate-slide-up">

      <!-- Mobile Logo (Hidden via CSS on Desktop) -->
      <div class="mobile-logo-wrapper d-lg-none text-center mb-2">
        <img src="assets/login/ois-meet-logo.svg" width="140" alt="OIS Meet Logo">
      </div>

      <div class="auth-card shadow-sm">

        <header class="text-center mb-1">
          <h2 class="fw-bold text-dark">Log In</h2>
          <p class="text-muted small">Access your workspace and start meeting</p>
        </header>

        <!-- Error Message Alert -->
        <div *ngIf="formError"
          class="alert alert-danger border-0 shadow-sm d-flex align-items-center gap-2 mb-2 animate-shake" role="alert">
          <i class="bi bi-exclamation-circle-fill fs-5"></i>
          <div>{{ formError }}</div>
        </div>

        <!-- Login Method Tabs -->
        <nav class="custom-tabs mb-2">
          <button class="nav-link" [class.active]="selectedTab === 'email'" (click)="showTab('email')" type="button">
            <i class="bi bi-envelope me-1"></i> Email
          </button>
          <button class="nav-link" [class.active]="selectedTab === 'userid'" (click)="showTab('userid')" type="button">
            <i class="bi bi-person-badge me-1"></i> ID
          </button>
          <button class="nav-link" [class.active]="selectedTab === 'mobile'" (click)="showTab('mobile')" type="button">
            <i class="bi bi-phone me-1"></i> Mobile
          </button>
        </nav>

        <form (ngSubmit)="onSubmit()" class="login-form">

          <!-- Tab-Specific Input Fields -->
          <div class="form-floating mb-2 animate-fade-in" *ngIf="selectedTab === 'email'">
            <input type="email" class="form-control" id="emailInput" placeholder="name@company.com" [(ngModel)]="userID"
              name="userID" required #emailInput>
            <label for="emailInput">Email address</label>
          </div>

          <div class="form-floating mb-2 animate-fade-in" *ngIf="selectedTab === 'userid'">
            <input type="text" class="form-control" id="useridInput" placeholder="User ID" [(ngModel)]="userID"
              name="userID" required #useridInput>
            <label for="useridInput">User ID</label>
          </div>

          <div class="form-floating mb-2 animate-fade-in" *ngIf="selectedTab === 'mobile'">
            <input type="tel" class="form-control" id="mobileInput" placeholder="Mobile Number" [(ngModel)]="userID"
              name="userID" required #mobileInput>
            <label for="mobileInput">Mobile Number</label>
          </div>

          <!-- Password Field -->
          <div class="form-floating mb-2 position-relative">
            <input [type]="isPasswordVisible ? 'text' : 'password'" class="form-control pe-5" id="passwordInput"
              placeholder="Password" [(ngModel)]="password" name="password" required #passwordInput>
            <label for="passwordInput">Password</label>
            <button type="button"
              class="btn btn-link password-toggle-btn position-absolute top-50 end-0 translate-middle-y me-2"
              (click)="togglePasswordVisibility()" title="Toggle password visibility">
              <i class="bi" [ngClass]="isPasswordVisible ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>

          <!-- CAPTCHA Section -->
          <div class="captcha-container mb-2">
            <div class="d-flex align-items-center gap-3">
              <div class="captcha-image-wrapper p-1 bg-white rounded flex-shrink-0">
                <img [src]="captcha?.imageBase64" alt="CAPTCHA" class="img-fluid" style="max-height: 40px;" />
              </div>
              <button type="button" class="refresh-btn bg-white" (click)="getCaptcha()" title="Refresh">
                <i class="bi bi-arrow-clockwise"></i>
              </button>
              <div class="form-floating flex-grow-1 mb-0">
                <input type="text" class="form-control" id="captchaInput" placeholder="Code" [(ngModel)]="enteredCode"
                  name="captchaCode" required #captchaInput>
                <label for="captchaInput">Enter code</label>
              </div>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="form-check custom-checkbox">
              <input class="form-check-input" type="checkbox" id="rememberMe" [(ngModel)]="isRememberMeChecked"
                name="rememberMe">
              <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
            </div>
            <a href="javascript:void(0)" class="text-decoration-none small">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="login-submit-btn" [disabled]="showLoading">
            <div class="d-flex align-items-center justify-content-center gap-2">
              <span *ngIf="showLoading" class="spinner-border spinner-border-sm" role="status"></span>
              <span>{{ showLoading ? loadingMessage : 'Log In' }}</span>
              <i *ngIf="!showLoading" class="bi bi-arrow-right"></i>
            </div>
          </button>

        </form>

        <footer class="text-center mt-4 pt-2">
          <p class="text-muted small mb-0">Don't have an account? <a href="javascript:void(0)" class="fw-bold">Contact
              Support</a></p>
        </footer>

      </div>
    </div>
  </section>

</div>
