<header class="activity-header-v2 px-4 py-3 border-bottom" *ngIf="activity()">
  <div class="header-content-v2 d-flex justify-content-between align-items-center w-100">
    <div class="header-left-v2 d-flex align-items-center gap-3">
      <div class="header-avatar-v2 position-relative">
        <img *ngIf="getAvatarImage()" [src]="getAvatarImage()!" class="avatar" alt="avatar">
        <div *ngIf="!getAvatarImage()" class="avatar-fallback shadow-sm" [style.background-color]="getAvatarColor()">
          {{ getAvatarLetter() }}
        </div>
      </div>
      
      <div class="header-title-group-v2">
        <div class="title-top d-flex align-items-center gap-2">
          <h2 class="header-title-v2 mb-0">{{ getDisplayName() }}</h2>
          <button class="btn-icon-v2" title="Favorite">
            <i class="bi bi-star"></i>
          </button>
        </div>
        <div class="title-meta-v2 fs-xs d-flex align-items-center gap-2">
          <span class="status-text-v2">{{ activity()?.context || 'Activity' }}</span>
        </div>
      </div>
    </div>

    <div class="header-right-v2 d-flex align-items-center gap-2">
      <div class="action-group-v2 d-flex align-items-center">
        <button class="header-action-btn-v2" title="Voice Call">
          <i class="bi bi-telephone"></i>
        </button>
        <button class="header-action-btn-v2" title="Video Call">
          <i class="bi bi-camera-video"></i>
        </button>
      </div>
      
      <div class="v-separator-v2 mx-2"></div>

      <button class="header-action-btn-v2" title="More Options">
        <i class="bi bi-three-dots"></i>
      </button>
    </div>
  </div>
</header>
