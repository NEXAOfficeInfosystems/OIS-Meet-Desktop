@if (activity()) {
  <div class="detail-header">
    <div class="sender-info">
      <ng-container *ngIf="getAvatarImage(); else letterAvatar">
        <img class="avatar avatar-image" [src]="getAvatarImage()!" alt="{{ getDisplayName() }}">
      </ng-container>
      <ng-template #letterAvatar>
        <div class="avatar" [style.background-color]="getAvatarColor()">{{ getAvatarLetter() }}</div>
      </ng-template>
      <div class="text">
        <h2 class="name">{{ getDisplayName() }}</h2>
        <span class="context">{{ activity()?.context || 'Meeting' }}</span>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn-action" aria-label="Start audio call">
        <i class="bi bi-telephone"></i>
      </button>
      <button class="btn-action" aria-label="Start video call">
        <i class="bi bi-camera-video"></i>
      </button>
      <button class="btn-action" aria-label="More options">
        <i class="bi bi-three-dots"></i>
      </button>
    </div>
  </div>
}
