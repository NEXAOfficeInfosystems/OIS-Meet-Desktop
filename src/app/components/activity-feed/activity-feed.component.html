<div class="activity-page-container">
  
  <!-- Left Panel: List & Filters -->
  <div class="list-panel">
    <app-activity-list
      [items]="filteredItems"
      [loading]="loading"
      [unreadCount]="unreadCount"
      [activeFilter]="activeFilter"
      [selectedId]="selectedActivity?.id || null"
      (filterChange)="applyFilter($event)"
      (select)="selectActivity($event)"
      (refresh)="loadActivities()">
    </app-activity-list>
  </div>

  <!-- Right Panel: Context Detail -->
  <div class="detail-panel">
    <app-activity-detail
      [activity]="selectedActivity"
      [messages]="contextMessages"
      [currentUserId]="session.getOISMeetUserId()"
      [loadingContext]="loadingContext"
      [isSending]="isSendingReply"
      [isUploading]="isUploadingFile"
      [replyTo]="replyToMessage"
      [sharedFiles]="sharedFiles"
      (refresh)="loadActivities()"
      (sendReply)="handleSendReply($event)"
      (fileSelect)="handleFileSelect($event)"
      (cancelReply)="replyToMessage = null"
      (loadMore)="selectedActivity && loadContext(selectedActivity, true)">
    </app-activity-detail>
  </div>

</div>
