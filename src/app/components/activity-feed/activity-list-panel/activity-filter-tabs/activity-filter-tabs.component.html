<div class="sidebar-tabs-v2 d-flex px-3 border-bottom">
  <button class="sidebar-tab-v2" 
          [class.active]="activeFilter() === 'all'" 
          (click)="setFilter('all')">All</button>
  <button class="sidebar-tab-v2" 
          [class.active]="activeFilter() === 'unread'" 
          (click)="setFilter('unread')">Unread</button>
  <button class="sidebar-tab-v2" 
          [class.active]="activeFilter() === 'mentions'" 
          (click)="setFilter('mentions')">&#64; Mentions</button>
</div>
