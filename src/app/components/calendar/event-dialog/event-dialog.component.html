<div class="modal-overlay" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="d-flex align-items-center gap-2">
        <div class="header-icon bg-primary px-2 py-1 rounded">
          <i class="bi bi-calendar-check text-white"></i>
        </div>
        <h2 class="title">{{ event ? 'Edit Meeting' : 'Schedule Meeting' }}</h2>
      </div>
      <button class="btn-close-compact" (click)="onClose()">
        <i class="bi bi-x"></i>
      </button>
    </div>
    
    <div class="modal-body pb-0">
      <form [formGroup]="eventForm" (ngSubmit)="onSave()">
        <div class="form-group mb-3">
          <input type="text" formControlName="title" placeholder="What's this meeting about?" class="title-field">
        </div>
        
        <div class="date-range-container mb-3">
          <div class="date-item">
            <span class="field-label">Start time</span>
            <div class="input-with-icon">
              <i class="bi bi-clock"></i>
              <input type="datetime-local" formControlName="startTime" class="modern-field">
            </div>
          </div>
          <div class="date-item">
            <span class="field-label">End time</span>
            <div class="input-with-icon">
              <i class="bi bi-clock"></i>
              <input type="datetime-local" formControlName="endTime" class="modern-field">
            </div>
          </div>
        </div>
        
        <div class="options-container mb-3 px-1">
          <label class="checkbox-label me-4">
            <input type="checkbox" formControlName="isAllDay">
            <span class="ms-2">All day</span>
          </label>
          
          <label class="checkbox-label">
            <input type="checkbox" formControlName="isPrivate">
            <span class="ms-2">Private</span>
          </label>
        </div>
        
        <div class="details-section mb-3">
          <div class="input-row mb-2">
            <i class="bi bi-geo-alt field-icon text-primary opacity-75"></i>
            <input type="text" formControlName="location" placeholder="Add location or link" class="underlined-field">
          </div>
          
          <div class="input-row align-items-start">
            <i class="bi bi-card-text field-icon text-primary opacity-75 mt-2"></i>
            <textarea formControlName="description" placeholder="Share a brief overview..." class="underlined-field h-20" rows="2"></textarea>
          </div>
        </div>
        
        <div class="form-group d-flex align-items-center gap-3 bg-light p-2 rounded mb-4">
          <label class="field-label mb-0 text-dark opacity-50">Recurrence:</label>
          <div class="select-wrapper border-0">
            <select formControlName="repeat" class="modern-select bg-transparent py-1">
              <option value="none">Happens once</option>
              <option value="daily">Every day</option>
              <option value="weekly">Every week</option>
              <option value="monthly">Every month</option>
            </select>
            <i class="bi bi-chevron-expand"></i>
          </div>
        </div>
        
        <div class="modal-footer-custom pb-3">
           <div class="d-flex justify-content-between align-items-center w-100">
             <div>
               @if (event) {
                 <button type="button" class="btn btn-outline-danger btn-sm border-0" (click)="onDelete()">
                   <i class="bi bi-trash"></i> Cancel
                 </button>
               }
             </div>
             <div class="d-flex gap-2">
               <button type="button" class="btn btn-link text-secondary text-decoration-none py-1" (click)="onClose()">Discard</button>
               <button type="submit" class="btn btn-primary px-5 shadow-sm" [disabled]="eventForm.invalid">
                 {{ event ? 'Save' : 'Schedule' }}
               </button>
             </div>
           </div>
        </div>
      </form>
    </div>




  </div>
</div>
