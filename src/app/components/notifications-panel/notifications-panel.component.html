<section class="collab-page">
  <header class="toolbar">
    <div>
      <p class="eyebrow">Inbox</p>
      <h1>Notifications</h1>
      <p class="subtitle">{{ unreadCount }} unread</p>
    </div>
    <button type="button" class="action-btn" (click)="markAllRead()">Mark all read</button>
  </header>

  <div class="notice-list">
    <article class="notice-item" *ngFor="let n of notifications" [class.unread]="!n.isRead">
      <div class="notice-dot"></div>
      <div>
        <div class="notice-title">{{ n.title }}</div>
        <div class="notice-body" *ngIf="settings.showMessagePreview">{{ n.body }}</div>
        <div class="notice-body text-muted italic" *ngIf="!settings.showMessagePreview">
          <i class="bi bi-eye-slash me-1"></i> Content hidden
        </div>
        <div class="notice-time">{{ n.createdAt | date:'short' }}</div>
      </div>
    </article>
    <div class="empty-state" *ngIf="notifications.length === 0">No notifications yet.</div>
  </div>
</section>
